name: release-please

# Gitflow: feature branches → develop → main. Every push to main updates the
# release PR. Merging that PR tags vX.Y.Z, creates the GitHub Release, and the
# jobs below publish the binaries, the webhook image and the npm package.
#
# Everything runs on GITHUB_TOKEN. Events that GITHUB_TOKEN causes never start
# other workflows, so the release jobs live here rather than in `on: release`
# workflows, and the release PR's CI is started with workflow_dispatch.

on:
  push:
    branches: [main]
  # Run by hand on main: with no tag it runs release-please (when a push did
  # not start it); with a tag it publishes that existing release again.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v0.12.0); leave empty to run release-please'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    if: ${{ github.ref == 'refs/heads/main' && !inputs.tag }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR's branch was pushed with GITHUB_TOKEN, so its CI did not
      # start by itself. Required checks need it, so dispatch it on that branch.
      # The PR JSON is parsed in the shell: a step's env is evaluated even when
      # its `if` is false, so fromJSON on an empty output would fail the job.
      - name: Run CI on the release PR
        if: ${{ steps.rp.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          branch=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // empty')
          case "$branch" in
            release-please--*) gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" ;;
            *) echo "::warning::unexpected release PR branch '$branch'; CI not dispatched" ;;
          esac

  # Picks the tag to publish: a release release-please just created, or the
  # tag given to a manual run. Empty means there is nothing to publish.
  plan:
    needs: release-please
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          CREATED: ${{ needs.release-please.outputs.release_created }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          tag=""
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$CREATED" = "true" ]; then
            tag="$RP_TAG"
          fi
          if [ -n "$tag" ]; then
            printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$' || { echo "invalid tag '$tag'" >&2; exit 1; }
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null || { echo "no release for '$tag'" >&2; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  binaries:
    needs: plan
    if: ${{ needs.plan.outputs.tag != '' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    permissions:
      contents: write

  webhook-image:
    needs: plan
    if: ${{ needs.plan.outputs.tag != '' }}
    uses: ./.github/workflows/build-webhook.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    permissions:
      contents: read
      packages: write

  # npm trusted publishing: npmjs.com trusts this workflow file in this repo,
  # so no npm token exists anywhere, and each version gets provenance. It runs
  # after `binaries` because npm/install.js downloads the tag's release assets.
  npm:
    needs: [plan, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2
      - name: Check the package version matches the tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: test "v$(node -p 'require("./npm/package.json").version')" = "$TAG"
      - run: npm publish --access public
        working-directory: npm

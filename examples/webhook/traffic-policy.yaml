# ngrok Traffic Policy — IP restrictions per endpoint path.
#
# Token Vault's static outbound IP is injected via the TOKENVAULT_IP env var
# (entrypoint.sh substitutes ${TOKENVAULT_IP}). This is defence-in-depth at the
# tunnel edge; the app also enforces the same denylist (DENY_IPS / TOKENVAULT_IP
# → ctx.config.denyIps) so the guarantee holds even without a tunnel.
#
# Deny the TV IP on the browser-facing endpoints agents reach via 307 redirect —
# TV should never call these directly:
#   /v1/credential, /v1/store, /v1/totp-code
# All other paths (/v1/health, /v1/storage, /v1/refresh, /v1/proxy, /bind, …)
# are allowed by default. Free tier supports 5 rules; this uses 3.

on_http_request:
  - name: "Deny TV IP on /v1/credential"
    expressions:
      - "req.url.path.startsWith('/v1/credential')"
      - "conn.client_ip == '${TOKENVAULT_IP}'"
    actions:
      - type: custom-response
        config:
          status_code: 403
          headers:
            content-type: application/json
          body: '{"error":"forbidden","message":"Token Vault server IP is not allowed on /v1/credential"}'

  - name: "Deny TV IP on /v1/store"
    expressions:
      - "req.url.path.startsWith('/v1/store')"
      - "conn.client_ip == '${TOKENVAULT_IP}'"
    actions:
      - type: custom-response
        config:
          status_code: 403
          headers:
            content-type: application/json
          body: '{"error":"forbidden","message":"Token Vault server IP is not allowed on /v1/store"}'

  - name: "Deny TV IP on /v1/totp-code"
    expressions:
      - "req.url.path.startsWith('/v1/totp-code')"
      - "conn.client_ip == '${TOKENVAULT_IP}'"
    actions:
      - type: custom-response
        config:
          status_code: 403
          headers:
            content-type: application/json
          body: '{"error":"forbidden","message":"Token Vault server IP is not allowed on /v1/totp-code"}'

name = "tv-webhook"
main = "src/runtime/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Set after `wrangler login` (or use CLOUDFLARE_ACCOUNT_ID in the environment):
# account_id = ""

# Non-secret configuration. Override per your deployment.
[vars]
TOKENVAULT_FRONTEND_URL = "https://tokenvault.uk"
# WEBHOOK_EXTERNAL_URL is normally auto-detected from the request host; set it
# only if you front the Worker with a custom domain that rewrites Host.
# WEBHOOK_EXTERNAL_URL = "https://tv-webhook.<account>.workers.dev"
# TOKENVAULT_IP — TV's egress IP, denied on /v1/credential, /v1/store, /v1/totp-code.
# TOKENVAULT_IP = ""
# DENY_IPS / DENY_ORIGINS — extra comma-separated denylist entries.

# ── KV namespaces ─────────────────────────────────────────────────────────────
# This webhook needs TWO KV namespaces: REPLAY (replay protection) and TOKENS
# (credential storage).
#
# The `id` values below are DEFAULT PLACEHOLDERS in real namespace-id format
# (32 hex chars), matching Cloudflare's own deploy-button templates. They are
# NOT real namespaces — do not expect them to resolve.
#
# Deploying with the "Deploy to Cloudflare" button?
#   Cloudflare's provisioner sees these bindings, PROVISIONS A FRESH namespace
#   for each (with a unique auto-generated name + new id) and rewrites these ids
#   in the deployed config. Because a new namespace is created every time, repeat
#   deploys do NOT collide. (This only works because the placeholders are in
#   valid hex-id format; a non-hex string makes the provisioner fall back to
#   naming the namespace after the worker, which then collides on re-deploy.)
#
# Deploying manually with the CLI? Create real namespaces and paste their ids:
#   wrangler kv namespace create REPLAY
#   wrangler kv namespace create TOKENS

# Replay protection (request IDs + ticket nonces). Required.
[[kv_namespaces]]
binding = "REPLAY"
id = "2a6702ef5db29638df2eea99422d0f22"

# Credential storage. Use this KV namespace OR a D1 'DB' (further down) — not
# both. KV is the simplest; D1 gives durable, strongly-consistent storage for
# refresh writes.
[[kv_namespaces]]
binding = "TOKENS"
id = "bbfdc8ee5cbe6087e84cfcb8c7ff34da"

# To use D1 instead of the TOKENS KV namespace, create a database and uncomment:
# [[d1_databases]]
# binding = "DB"
# database_name = "tv-webhook"
# database_id = "placeholder_d1_database_id"

# ── Secrets ───────────────────────────────────────────────────────────────────
# Set via `wrangler secret put`, never in this file. NOTE: the button deploys the
# code + KV, but it does NOT set these — the webhook cannot bind to Token Vault
# until you set TV_WEBHOOK_SEED (Worker → Settings → Variables, or the CLI below).
#   TV_WEBHOOK_SEED      — the ONLY persisted secret. The AES-256 key + HMAC
#                          secret are HKDF-derived from it in memory, stable
#                          across redeploys. Use a long random value, e.g.
#                          `openssl rand -hex 32 | wrangler secret put TV_WEBHOOK_SEED`.
#   OAUTH_PROVIDERS_JSON — optional. JSON map provider→{clientSecret,clientId?,tokenUrl?}
#                          enabling autonomous OAuth refresh (/v1/refresh-notify).

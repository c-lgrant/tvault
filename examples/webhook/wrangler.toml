name = "tv-webhook"
main = "src/runtime/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Set after `wrangler login` (or use CLOUDFLARE_ACCOUNT_ID in the environment):
# account_id = ""

# Non-secret configuration. Override per your deployment.
[vars]
TOKENVAULT_FRONTEND_URL = "https://tokenvault.uk"
# WEBHOOK_EXTERNAL_URL is normally auto-detected from the request host; set it
# only if you front the Worker with a custom domain that rewrites Host.
# WEBHOOK_EXTERNAL_URL = "https://tv-webhook.<account>.workers.dev"
# TOKENVAULT_IP — TV's egress IP, denied on /v1/credential, /v1/store, /v1/totp-code.
# TOKENVAULT_IP = ""
# DENY_IPS / DENY_ORIGINS — extra comma-separated denylist entries.

# ── KV namespace ──────────────────────────────────────────────────────────────
# ONE KV namespace backs everything: replay protection (request IDs + ticket
# nonces) AND credential storage. The keys never collide — replay uses `rid:`/
# `nonce:` prefixes, storage uses `collection:key`.
#
# Why one namespace and not two? The "Deploy to Cloudflare" button names every
# new KV namespace after the worker (`tv-webhook`). Two bindings would both ask
# to create `tv-webhook` and the second would fail with "already exists". A single
# binding sidesteps that — the wizard provisions exactly one namespace.
#
# `id` is a DEFAULT PLACEHOLDER in real namespace-id format (32 hex chars). It is
# NOT a real namespace — do not expect it to resolve.
#
# One-click deploy (button): the wizard shows a single "Select KV namespace" step.
#   - First deploy: pick "Create new" — it makes one namespace and rewrites this id.
#   - Re-deploying (or if a leftover `tv-webhook` namespace exists from a previous
#     attempt): pick the EXISTING namespace instead of creating a new one, to
#     avoid an "already exists" error.
#
# Manual deploy (CLI): create a namespace and paste its id:
#   wrangler kv namespace create KV
[[kv_namespaces]]
binding = "KV"
id = "2a6702ef5db29638df2eea99422d0f22"

# Prefer durable, strongly-consistent storage for refresh writes? Add a D1
# database and the runtime uses it for credential storage instead of KV (the KV
# namespace above is still required for replay). Create the DB and uncomment:
# [[d1_databases]]
# binding = "DB"
# database_name = "tv-webhook"
# database_id = "placeholder_d1_database_id"

# ── Secrets ───────────────────────────────────────────────────────────────────
# Set via `wrangler secret put`, never in this file. NOTE: the button deploys the
# code + KV, but it does NOT set these — the webhook cannot bind to Token Vault
# until you set TV_WEBHOOK_SEED (Worker → Settings → Variables, or the CLI below).
#   TV_WEBHOOK_SEED      — the ONLY persisted secret. The AES-256 key + HMAC
#                          secret are HKDF-derived from it in memory, stable
#                          across redeploys. Use a long random value, e.g.
#                          `openssl rand -hex 32 | wrangler secret put TV_WEBHOOK_SEED`.
#   OAUTH_PROVIDERS_JSON — optional. JSON map provider→{clientSecret,clientId?,tokenUrl?}
#                          enabling autonomous OAuth refresh (/v1/refresh-notify).

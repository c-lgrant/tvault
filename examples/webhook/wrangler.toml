name = "tv-webhook"
main = "src/runtime/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Set after `wrangler login` (or use CLOUDFLARE_ACCOUNT_ID in the environment):
# account_id = ""

# Non-secret configuration. Override per your deployment.
[vars]
# TOKENVAULT_FRONTEND_URL is REQUIRED — no silent fallback. Set this to the
# Token Vault frontend origin (e.g. "https://tokenvault.uk" for the hosted
# service, or your self-hosted origin).
TOKENVAULT_FRONTEND_URL = "https://tokenvault.uk"
# WEBHOOK_EXTERNAL_URL is normally auto-detected from the request host; set it
# only if you front the Worker with a custom domain that rewrites Host.
# WEBHOOK_EXTERNAL_URL = "https://tv-webhook.<account>.workers.dev"
# TOKENVAULT_IP — TV's egress IP, denied on /v1/credential, /v1/store, /v1/totp-code.
# TOKENVAULT_IP = ""
# DENY_IPS / DENY_ORIGINS — extra comma-separated denylist entries.

# ── D1 database (credential storage) ──────────────────────────────────────────
# Credentials live in D1 — durable and strongly-consistent (read-your-writes,
# which matters for OAuth refresh). The `kv` table self-creates on the first
# request (idempotent CREATE TABLE IF NOT EXISTS in D1StorageAdapter.create);
# there is no migration step. (Replay protection uses the per-colo Cache API —
# no binding, no daily write quota — so there is NO KV namespace to provision.)
#
# `database_id` is DELIBERATELY OMITTED. Wrangler (>=4.45) auto-provisions the
# database on first deploy and KEEPS IT LINKED across every later deploy, so a
# git-push (Workers Builds) redeploy reuses the SAME database — no data loss, and
# no account-specific id baked into this shared template. Do NOT add a placeholder
# id: a non-empty `database_id` disables auto-provisioning and points the binding
# at a database that doesn't exist. (Manual CLI deploy: run `wrangler d1 create
# tv-webhook` once and either let auto-provisioning link it by name or paste the
# returned id here.)
[[d1_databases]]
binding = "DB"
database_name = "tv-webhook"

# ── Observability (Workers Logs + invocation traces) ──────────────────────────
# Persists structured logs and per-invocation traces, viewable in the dashboard
# (Workers & Pages → this worker → Logs / Observability) and live via
# `wrangler tail`. head_sampling_rate = 1 keeps 100% (drop it for high traffic).
[observability]
enabled = true
head_sampling_rate = 1

# ── Secret: the root seed ─────────────────────────────────────────────────────
# The webhook needs ONE root seed before it can bind. The AES-256 key, HMAC
# secret, and webhook id are all HKDF-derived from it in memory — never persisted,
# stable across redeploys. Provide it as an encrypted, write-only Worker Secret
# (never in this file):
#   openssl rand -hex 32 | wrangler secret put TV_WEBHOOK_SEED
# The canonical `deploy` script (`npm run deploy` -> scripts/deploy.sh) auto-
# provisions this Secret on the first deploy when the build token has
# `Workers Scripts: Edit`, so a git-push deploy is bindable with no manual step.
# See deploy/cloudflare/README.md.
#   OAUTH_PROVIDERS_JSON — optional Secret. JSON map provider->{clientSecret,clientId?,tokenUrl?}
#                          enabling autonomous OAuth refresh (/v1/refresh-notify).
#   TV_ADMIN_SECRET — optional Secret. When set, this value must be supplied as
#                     the x-tv-admin-secret request header to access the setup
#                     endpoints (/bind, /v1/register-url, /v1/exchange) after
#                     the first successful bind. Without it a bound webhook is
#                     fully sealed — re-binding requires configuring this secret.
#   Set via: openssl rand -hex 32 | wrangler secret put TV_ADMIN_SECRET
